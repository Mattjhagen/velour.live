services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-velour}
      POSTGRES_USER: ${POSTGRES_USER:-velour}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - control-plane
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-velour}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes:
      - redis-data:/data
    networks:
      - control-plane
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-velour}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-velour}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NEXTAUTH_URL: ${NEXTAUTH_URL:?set NEXTAUTH_URL in .env}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?set GITHUB_CLIENT_ID in .env}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?set GITHUB_CLIENT_SECRET in .env}
      VELOUR_ADMIN_EMAIL: ${VELOUR_ADMIN_EMAIL:?set VELOUR_ADMIN_EMAIL in .env}
      VELOUR_ENCRYPTION_KEY: ${VELOUR_ENCRYPTION_KEY:?set VELOUR_ENCRYPTION_KEY in .env}
      MIGRATIONS_PATH: /app/migrations
      HOSTNAME: "0.0.0.0"
    networks:
      - control-plane
      - ingress
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    environment:
      # Allow only the Docker API endpoints the worker actually needs
      CONTAINERS: 1
      NETWORKS: 1
      IMAGES: 1
      POST: 1
      DELETE: 1
      # Block everything else (exec, build API, secrets, swarm)
      BUILD: 0
      EXEC: 0
      AUTH: 0
      SECRETS: 0
      SERVICES: 0
      SWARM: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-proxy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-velour}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-velour}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ARTIFACTS_PATH: /var/lib/velour/artifacts
      SITES_PATH: /var/lib/velour/sites
      # Route Docker API through the socket proxy — no raw socket in worker
      DOCKER_HOST: tcp://docker-proxy:2375
      # Explicit Docker network name for user app containers (must match network.name below)
      INGRESS_NETWORK: velour_ingress
      # Caddy Admin API — reachable because caddy is on control-plane network
      CADDY_ADMIN_URL: http://caddy:2019
      VELOUR_DOMAIN: ${VELOUR_DOMAIN:-velour.live}
    volumes:
      # Shared velour data dir: artifacts written here, sites symlinked here
      - /var/lib/velour:/var/lib/velour
    networks:
      - control-plane
      - docker-proxy
    depends_on:
      docker-proxy:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    # No host ports needed — cloudflared reaches Caddy via Docker network
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      # Serve static sites read-only; symlinks resolve within this same mount
      - /var/lib/velour:/var/lib/velour:ro
    networks:
      - ingress
      - control-plane  # allows worker to reach Admin API at caddy:2019
    depends_on:
      - dashboard
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    networks:
      - ingress
    depends_on:
      - caddy
    restart: unless-stopped

networks:
  control-plane:
    internal: true
    name: velour_control-plane
  ingress:
    name: velour_ingress
  docker-proxy:
    internal: true
    name: velour_docker-proxy
  # Per-build and per-cbuild networks are created dynamically by the worker

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
